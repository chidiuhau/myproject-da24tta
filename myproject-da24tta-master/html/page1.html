<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Hóa đơn thanh toán</title>
    <link href="../ccs/style1.css" rel="stylesheet">
</head>
<body>
    <h2>Hóa đơn mua hàng</h2>
    <table>
        <thead>
            <tr>
                <th>Tên sản phẩm</th>
                <th>Số lượng</th>
                <th>Đơn giá</th>
                <th>Thành tiền</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>A</td>
                <td class="sl">3</td>
                <td class="dg">10000</td>
                <td class="tt">0</td>
            </tr>
            <tr>
                <td>B</td>
                <td class="sl">4</td>
                <td class="dg">20000</td>
                <td class="tt">0</td>
            </tr>
            <tr>
                <td>C</td>
                <td class="sl">7</td>
                <td class="dg">30000</td>
                <td class="tt">0</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td colspan="3">Tổng tiền</td>
                <td id="tongtien">0</td>
            </tr>
        </tfoot>
    </table>

    <script>
        let soluong = document.getElementsByClassName("sl");
        let dongia = document.getElementsByClassName("dg");
        let thanhtien = document.getElementsByClassName("tt");
        let tongthanhtoan = 0;

        for (let i = 0; i < soluong.length; i++) {
            let sl = parseInt(soluong[i].innerHTML);
            let dg = parseInt(dongia[i].innerHTML);
            let tt = sl * dg;
            thanhtien[i].innerHTML = tt;
            tongthanhtoan += tt;
        }

        document.getElementById("tongtien").innerHTML = tongthanhtoan;
    </script>
</body>
</html>
