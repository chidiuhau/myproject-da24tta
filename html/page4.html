<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bài tập số 09</title>
    <link href="../ccs/style4.css" rel="stylesheet">
</head>
<body>
    <h2>In bảng cửu chương</h2>

<form name="frmInCC">
    <label>Nhập số:</label>
    <input type="text" id="txtSo" value="5">
    <input type="button" value="In" onclick="inBangCC()">
    <div id="ketqua"></div>
</form>

<script>
    function la_so(x){
        return !isNaN(x) && x.trim() !== "";
    }

    function inBangCC(){
        let myForm = document.forms["frmInCC"];
        let num = myForm.elements["txtSo"].value;
        let kq = document.getElementById("ketqua");

        if(!la_so(num)){
            kq.innerHTML = "Số nhập không hợp lệ!";
            return;
        }
        num = parseInt(num);
        let str = "";
        for(let i = 1; i <= 10; i++){
            str += num + "x" + i + "=" + (num*i) + "<br>";
        }
        kq.innerHTML = str;
    }
</script>
</body>
</html>
