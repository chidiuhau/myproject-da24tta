<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Trang sản phẩm</title>

    <style>
        body {
            font-family: Arial;
            background: #f5f5f5;
            padding: 20px;
        }

        .product-item {
            width: 250px;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .product-image img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .product-info {
            padding: 15px;
        }

        .product-info p:first-child {
            font-weight: bold;
        }

        .product-info p:nth-child(2) {
            color: red;
            margin: 10px 0;
        }

        .product-info a {
            text-decoration: none;
            background: orange;
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
        }
    </style>
</head>

<body>

<script>
// ===== 1. TẠO KHUNG CHA =====
const productItem = document.createElement("div");
productItem.setAttribute("class", "product-item");


// ===== 2. KHUNG 1: HÌNH =====
const productDiv1 = document.createElement("div");
productDiv1.setAttribute("class", "product-image");

const productImage = document.createElement("img");
productImage.setAttribute("src", "https://hoatuoidatviet.vn/thumb/600x667/1/upload/sanpham/bo-hoa-hong-do-cuc-xinh-tinh-1347.jpg");
productImage.setAttribute("alt", "Hạt giống hoa hồng Pháp");

productDiv1.appendChild(productImage);
productItem.appendChild(productDiv1);


// ===== 3. KHUNG 2: THÔNG TIN =====
const productInfo = document.createElement("div");
productInfo.setAttribute("class", "product-info");

// Tên
const name = document.createElement("p");
name.textContent = "Hạt giống hoa hồng Pháp";

// Giá
const price = document.createElement("p");
price.textContent = "250.000đ";

// Link
const link = document.createElement("a");
link.setAttribute("href", "#");
link.textContent = "Xem chi tiết";

// Gắn vào info
productInfo.appendChild(name);
productInfo.appendChild(price);
productInfo.appendChild(link);

// Gắn vào item
productItem.appendChild(productInfo);


// ===== 4. GẮN VÀO BODY =====
document.body.appendChild(productItem);

</script>

</body>
</html>
